server {
    listen 80;
    # The stock 10-listen-on-ipv6-by-default.sh entrypoint script only patches
    # the packaged default.conf. This file replaces it, so the script logs
    # "differs from the packaged version" and skips — IPv6 has to be declared
    # here instead.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Opportunistic scanners probe these constantly. 444 closes the connection
    # without a response, so they stop costing a rendered 404 page each.
    # .well-known stays reachable — ACME and friends need it.
    location ~* (^/(wp-|wordpress|xmlrpc\.php|phpmyadmin|vendor/|autodiscover)|^/\.(?!well-known)) {
        access_log off;
        return 444;
    }

    # Build assets carry a content hash in the filename, so they can be
    # cached indefinitely.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Icons, the manifest and the share card are stable but not hashed — a week
    # is enough that they stop showing up in the log, short enough to replace
    # them.
    location ~* ^/(favicon\.ico|icon\.svg|icon-\d+\.png|apple-touch-icon(-precomposed)?\.png|site\.webmanifest|og\.png)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Crawler-facing files. A day, because a crawler that comes back sooner
    # than that is not going to find anything different, and these get hit far
    # more often than they change. Logged — who fetches llms.txt is the whole
    # reason it exists.
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # llms.txt is for models, not for search results — noindex keeps it from
    # ranking against the page it summarises. Nothing stops a model reading it.
    location = /llms.txt {
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
        default_type "text/plain; charset=utf-8";
    }

    # The résumé is a real indexable document — Google reads PDFs — so it gets
    # no noindex, just a cache window.
    location = /resume.pdf {
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # next.config.ts uses trailingSlash, so directory-style routes resolve to
    # their index.html; $uri.html covers anything emitted flat.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/font-woff2 application/xml text/xml;
}
