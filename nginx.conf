server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Build assets carry a content hash in the filename, so they can be
    # cached indefinitely.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # next.config.ts uses trailingSlash, so directory-style routes resolve to
    # their index.html; $uri.html covers anything emitted flat.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;
}
